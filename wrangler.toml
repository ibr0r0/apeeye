name = "apeeye"
main = "server/worker.js"
compatibility_date = "2025-09-01"

routes = [
  { pattern = "apeeye.ibr0r.com", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[durable_objects.bindings]]
name = "WORKSPACES"
class_name = "WorkspaceDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceDO"]

[[unsafe.bindings]]
name = "IP_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[observability]
enabled = true
